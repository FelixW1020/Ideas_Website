<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<meta name="description" content="A quiet space for project ideas and the dates you're aiming at.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='none' stroke='%23111' stroke-width='2'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Orbit</h1>
    <p class="stats">
      <span id="statTotal">0</span> ideas
      <span class="sep">·</span>
      <span id="statSoon">0</span> this week
      <span class="sep">·</span>
      <span id="statLate" class="late-count">0</span> overdue
    </p>
  </div>

  <div class="controls">
    <input id="search" class="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search ideas">

    <div class="views" role="tablist" aria-label="View">
      <button role="tab" class="view active" data-view="float" aria-selected="true">Float</button>
      <button role="tab" class="view" data-view="timeline" aria-selected="false">Timeline</button>
    </div>

    <div class="menu-wrap">
      <button class="more" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false">···</button>
      <div class="menu" id="menu" hidden>
        <button data-act="export">Export</button>
        <button data-act="import">Import</button>
        <button data-act="shuffle">Rearrange</button>
        <button data-act="wipe">Delete all</button>
      </div>
    </div>
  </div>
</header>

<nav class="filters" id="filters">
  <button class="chip active" data-filter="all">All</button>
  <button class="chip" data-filter="spark">Spark</button>
  <button class="chip" data-filter="brewing">Brewing</button>
  <button class="chip" data-filter="building">Building</button>
  <button class="chip" data-filter="shipped">Shipped</button>
  <button class="chip" data-filter="parked">Parked</button>
  <span class="filters-sep"></span>
  <button class="chip" data-filter="dated">Dated</button>
  <button class="chip" data-filter="undated">Undated</button>
</nav>

<main>
  <section id="stage" class="stage" aria-label="Floating ideas"></section>
  <section id="timeline" class="timeline" aria-label="Timeline" hidden></section>

  <div class="empty" id="empty" hidden>
    <p>Nothing here yet.</p>
    <p class="dim">Add one below — try <code>Study app @in 3 weeks #school</code></p>
  </div>
</main>

<form class="composer" id="composer" autocomplete="off">
  <input id="quickAdd" type="text" placeholder="New idea" aria-label="New idea">
  <span class="hints" id="composerHints"></span>
  <button type="submit" class="add">Add</button>
</form>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-scrim" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="modal-close" data-close aria-label="Close">×</button>

    <input id="mTitle" class="modal-title" placeholder="Untitled idea">

    <label class="field">
      <span class="field-label">Notes</span>
      <textarea id="mNote" rows="4" placeholder="What is it? First step?"></textarea>
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field-label">Anticipated date</span>
        <input id="mDate" type="date">
      </label>
      <label class="field">
        <span class="field-label">Status</span>
        <select id="mStatus">
          <option value="spark">Spark</option>
          <option value="brewing">Brewing</option>
          <option value="building">Building</option>
          <option value="shipped">Shipped</option>
          <option value="parked">Parked</option>
        </select>
      </label>
    </div>

    <div class="quick-dates" id="quickDates">
      <button type="button" data-days="7">+1 week</button>
      <button type="button" data-days="14">+2 weeks</button>
      <button type="button" data-days="30">+1 month</button>
      <button type="button" data-days="90">+1 quarter</button>
      <button type="button" data-days="clear">Clear</button>
    </div>

    <label class="field">
      <span class="field-label">Tags</span>
      <input id="mTags" placeholder="school, ai, weekend">
    </label>

    <p class="countdown" id="mCountdown"></p>

    <div class="modal-foot">
      <button class="btn quiet" id="mDelete">Delete</button>
      <span class="grow"></span>
      <button class="btn" id="mSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept="application/json" hidden>

<script src="app.js"></script>
</body>
</html>
